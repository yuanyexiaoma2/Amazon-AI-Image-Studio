paths:
  /api/register:
    post:
      summary: Register a new user (creates default workspace)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
                  minLength: 12
                  maxLength: 128
                name:
                  type: string
                  minLength: 1
                  maxLength: 120
              required:
                - email
                - password
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  email:
                    type: string
                    format: email
                  name:
                    type: string
                    nullable: true
                required:
                  - id
                  - email
                  - name
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      requestId:
                        type: string
                      details:
                        nullable: true
                    required:
                      - code
                      - message
                      - requestId
                required:
                  - error
  /api/workspaces/{workspaceId}/uploads/presign:
    post:
      summary: Create presigned upload session + Asset stub
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                projectId:
                  type: string
                  format: uuid
                filename:
                  type: string
                  minLength: 1
                  maxLength: 255
                mimeType:
                  type: string
                  enum: *a7
                bytes:
                  type: integer
                  minimum: 0
                  exclusiveMinimum: true
                  maximum: 20971520
              required:
                - projectId
                - filename
                - mimeType
                - bytes
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  uploadId:
                    type: string
                    format: uuid
                  assetId:
                    type: string
                    format: uuid
                  uploadUrl:
                    type: string
                    format: uri
                  storageKey:
                    type: string
                  expiresAt:
                    type: string
                    format: date-time
                  headers:
                    type: object
                    additionalProperties:
                      type: string
                required:
                  - uploadId
                  - assetId
                  - uploadUrl
                  - storageKey
                  - expiresAt
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      requestId:
                        type: string
                      details:
                        nullable: true
                    required:
                      - code
                      - message
                      - requestId
                required:
                  - error
  /api/workspaces/{workspaceId}/uploads/{uploadId}/complete:
    post:
      summary: Complete upload, verify checksum, enqueue inspect
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                checksumSha256:
                  type: string
                  pattern: ^[a-f0-9]{64}$
                completionKey:
                  type: string
                  minLength: 8
                  maxLength: 128
      responses:
        "200":
          description: Inspecting / ready
          content:
            application/json:
              schema:
                type: object
                properties:
                  uploadId:
                    type: string
                    format: uuid
                  assetId:
                    type: string
                    format: uuid
                  status:
                    type: string
                    enum: *a8
                  assetStatus:
                    type: string
                    enum: *a9
                required:
                  - uploadId
                  - assetId
                  - status
                  - assetStatus
