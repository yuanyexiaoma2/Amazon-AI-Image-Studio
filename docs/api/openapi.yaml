                      constraints:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              format: uuid
                            kind:
                              type: string
                              enum: *a11
                            path:
                              type: string
                            rule:
                              type: string
                            severity:
                              type: string
                          required:
                            - id
