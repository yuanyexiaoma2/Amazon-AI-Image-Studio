openapi: 3.0.3
info:
  title: Amazon AI Image Studio API
  version: 0.3.1
  description: OpenAPI from Zod contracts (W1 + W2 + W3-A Shot Plan + W3-B1
    Workflow canvas).
servers:
  - url: http://localhost:3000
components:
  schemas:
    RegisterRequest:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
          minLength: 12
          maxLength: 128
        name:
          type: string
          minLength: 1
          maxLength: 120
      required:
        - email
        - password
    UserResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
          nullable: true
      required:
        - id
        - email
        - name
    CreateProjectRequest:
      type: object
      properties:
        sku:
          type: string
          minLength: 1
          maxLength: 64
        name:
          type: string
          minLength: 1
          maxLength: 200
        marketplace:
          type: string
          minLength: 2
          maxLength: 8
          default: US
        category:
          type: string
          maxLength: 200
        asin:
          type: string
          maxLength: 20
      required:
        - sku
        - name
    Project:
      type: object
      properties:
        id:
          type: string
          format: uuid
        workspaceId:
          type: string
          format: uuid
        sku:
          type: string
        name:
          type: string
        marketplace:
          type: string
        category:
          type: string
          nullable: true
        asin:
          type: string
          nullable: true
        status:
          type: string
          enum:
            - ACTIVE
            - ARCHIVED
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - workspaceId
        - sku
        - name
        - marketplace
        - category
        - asin
        - status
        - createdAt
    ApiError:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            requestId:
              type: string
            details:
              nullable: true
          required:
            - code
            - message
            - requestId
      required:
        - error
    PresignUploadRequest:
      type: object
      properties:
        projectId:
          type: string
          format: uuid
        filename:
          type: string
          minLength: 1
          maxLength: 255
        mimeType:
          type: string
          enum: &a4
            - image/png
            - image/jpeg
            - image/webp
        bytes:
          type: integer
          minimum: 0
          exclusiveMinimum: true
          maximum: 20971520
      required:
        - projectId
        - filename
        - mimeType
        - bytes
    PresignUploadResponse:
      type: object
      properties:
        uploadId:
          type: string
          format: uuid
        assetId:
          type: string
          format: uuid
        uploadUrl:
          type: string
          format: uri
        storageKey:
          type: string
        expiresAt:
          type: string
          format: date-time
        headers:
          type: object
          additionalProperties:
            type: string
      required:
        - uploadId
        - assetId
        - uploadUrl
        - storageKey
        - expiresAt
    CompleteUploadRequest:
      type: object
      properties:
        checksumSha256:
          type: string
          pattern: ^[a-f0-9]{64}$
        completionKey:
          type: string
          minLength: 8
          maxLength: 128
    CompleteUploadResponse:
      type: object
      properties:
        uploadId:
          type: string
          format: uuid
        assetId:
          type: string
          format: uuid
        status:
          type: string
          enum: &a5
            - CREATED
            - UPLOADING
            - UPLOADED
            - INSPECTING
            - READY
            - REJECTED
            - EXPIRED
        assetStatus:
          type: string
          enum: &a6
            - UPLOADING
            - PROCESSING
            - READY
            - REJECTED
            - ARCHIVED
      required:
        - uploadId
        - assetId
        - status
        - assetStatus
    TruthPackResponse:
      type: object
      properties:
        documentId:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        currentRevisionId:
          type: string
          nullable: true
          format: uuid
        approvedRevisionId:
          type: string
          nullable: true
          format: uuid
        revision:
          type: object
          nullable: true
          properties:
            id:
              type: string
              format: uuid
            revision:
              type: integer
            status:
              type: string
              enum: &a7
                - DRAFT
                - PENDING_REVIEW
                - APPROVED
                - SUPERSEDED
            facts:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  key:
                    type: string
                  value:
                    nullable: true
                  confidence:
                    type: number
                  status:
                    type: string
                    enum: &a1
                      - EXTRACTED
                      - CONFIRMED
                      - REJECTED
                      - LOCKED
                  evidenceAssetVersionIds:
                    type: array
                    items:
                      type: string
                      format: uuid
                required:
                  - id
                  - key
                  - confidence
                  - status
                  - evidenceAssetVersionIds
            constraints:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  kind:
                    type: string
                    enum: &a8
                      - LOCK
                      - ALLOW
                      - UNKNOWN
                  path:
                    type: string
                  rule:
                    type: string
                  severity:
                    type: string
                required:
                  - id
                  - kind
                  - path
                  - rule
                  - severity
            approvedAt:
              type: string
              nullable: true
              format: date-time
            approvedByUserId:
              type: string
              nullable: true
              format: uuid
          required:
            - id
            - revision
            - status
            - facts
            - constraints
            - approvedAt
            - approvedByUserId
      required:
        - documentId
        - projectId
        - currentRevisionId
        - approvedRevisionId
        - revision
    SaveTruthPackRequest:
      type: object
      properties:
        facts:
          type: array
          items:
            type: object
            properties:
              key:
                type: string
                minLength: 1
                maxLength: 128
              value:
                nullable: true
              confidence:
                type: number
                minimum: 0
                maximum: 1
              status:
                type: string
                enum: *a1
              evidenceAssetVersionIds:
                type: array
                items:
                  type: string
                  format: uuid
            required:
              - key
          minItems: 1
        locks:
          type: array
          items:
            type: string
            minLength: 1
        allowedChanges:
          type: array
          items:
            type: string
            minLength: 1
      required:
        - facts
    ShotPlanResponse:
      type: object
      properties:
        documentId:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        currentRevisionId:
          type: string
          nullable: true
          format: uuid
        approvedRevisionId:
          type: string
          nullable: true
          format: uuid
        revision:
          type: object
          nullable: true
          properties:
            id:
              type: string
              format: uuid
            revision:
              type: integer
            status:
              type: string
              enum: &a9
                - DRAFT
                - PENDING_REVIEW
                - APPROVED
                - SUPERSEDED
            truthRevisionId:
              type: string
              format: uuid
            provider:
              type: string
              nullable: true
            modelId:
              type: string
              nullable: true
            briefs:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  slot:
                    type: string
                    enum: &a2
                      - MAIN
                      - FEATURE
                      - DETAIL
                      - DIMENSION
                      - LIFESTYLE
                      - PACKAGE
                  purpose:
                    type: string
                  orderIndex:
                    type: integer
                    minimum: 0
                    exclusiveMinimum: true
                  copy:
                    type: array
                    items:
                      nullable: true
                  constraints:
                    type: object
                    properties:
                      must:
                        type: array
                        items:
                          type: string
                      mustNot:
                        type: array
                        items:
                          type: string
                      qaPolicy:
                        type: string
                      aspectRatio:
                        type: string
                      targetPixels:
                        type: object
                        properties:
                          width:
                            type: integer
                            minimum: 0
                            exclusiveMinimum: true
                          height:
                            type: integer
                            minimum: 0
                            exclusiveMinimum: true
                        required:
                          - width
                          - height
                      referencedAssetVersionIds:
                        type: array
                        items:
                          type: string
                          format: uuid
                    required:
                      - must
                      - mustNot
                      - qaPolicy
                      - aspectRatio
                      - targetPixels
                      - referencedAssetVersionIds
                required:
                  - id
                  - slot
                  - purpose
                  - orderIndex
                  - copy
                  - constraints
            approvedAt:
              type: string
              nullable: true
              format: date-time
            approvedByUserId:
              type: string
              nullable: true
              format: uuid
          required:
            - id
            - revision
            - status
            - truthRevisionId
            - provider
            - modelId
            - briefs
            - approvedAt
            - approvedByUserId
        canvasPayload:
          type: object
          nullable: true
          properties:
            planDocumentId:
              type: string
              format: uuid
            planRevisionId:
              type: string
              format: uuid
            projectId:
              type: string
              format: uuid
            workspaceId:
              type: string
              format: uuid
            truthRevisionId:
              type: string
              format: uuid
            briefs:
              type: array
              items:
                type: object
                properties:
                  briefId:
                    type: string
                    format: uuid
                  slot:
                    type: string
                    enum: *a2
                  purpose:
                    type: string
                  orderIndex:
                    type: integer
                  aspectRatio:
                    type: string
                  targetPixels:
                    type: object
                    properties:
                      width:
                        type: integer
                      height:
                        type: integer
                    required:
                      - width
                      - height
                  copy:
                    type: array
                    items:
                      nullable: true
                  must:
                    type: array
                    items:
                      type: string
                  mustNot:
                    type: array
                    items:
                      type: string
                  qaPolicy:
                    type: string
                  referencedAssetVersionIds:
                    type: array
                    items:
                      type: string
                      format: uuid
                required:
                  - briefId
                  - slot
                  - purpose
                  - orderIndex
                  - aspectRatio
                  - targetPixels
                  - copy
                  - must
                  - mustNot
                  - qaPolicy
                  - referencedAssetVersionIds
          required:
            - planDocumentId
            - planRevisionId
            - projectId
            - workspaceId
            - truthRevisionId
            - briefs
      required:
        - documentId
        - projectId
        - currentRevisionId
        - approvedRevisionId
        - revision
        - canvasPayload
    GenerateShotPlanRequest:
      type: object
      properties:
        truthRevisionId:
          type: string
          format: uuid
        includePackage:
          type: boolean
    SaveShotPlanRequest:
      type: object
      properties:
        truthRevisionId:
          type: string
          format: uuid
        readyForReview:
          type: boolean
          default: true
        briefs:
          type: array
          items:
            type: object
            properties:
              slot:
                type: string
                enum: *a2
              purpose:
                type: string
                minLength: 1
                maxLength: 512
              orderIndex:
                type: integer
                minimum: 0
                exclusiveMinimum: true
              copy:
                type: array
                items:
                  nullable: true
              must:
                type: array
                items:
                  type: string
              mustNot:
                type: array
                items:
                  type: string
              qaPolicy:
                type: string
              aspectRatio:
                type: string
              targetPixels:
                type: object
                properties:
                  width:
                    type: integer
                    minimum: 0
                    exclusiveMinimum: true
                  height:
                    type: integer
                    minimum: 0
                    exclusiveMinimum: true
                required:
                  - width
                  - height
              referencedAssetVersionIds:
                type: array
                items:
                  type: string
                  format: uuid
            required:
              - slot
              - purpose
              - orderIndex
          minItems: 1
          maxItems: 20
      required:
        - briefs
    ApproveShotPlanRequest:
      type: object
      properties:
        revisionId:
          type: string
          format: uuid
      required:
        - revisionId
    CreateWorkflowRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
          default: Untitled workflow
    PatchWorkflowRequest:
      type: object
      properties:
        ifRevision:
          type: integer
          minimum: 0
        graph:
          type: object
          properties:
            schemaVersion:
              type: number
              enum:
                - 1
            nodes:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                    minLength: 1
                    maxLength: 128
                  type:
                    type: string
                    minLength: 1
                    maxLength: 64
                  position:
                    type: object
                    properties:
                      x:
                        type: number
                      y:
                        type: number
                    required:
                      - x
                      - y
                  config:
                    type: object
                    additionalProperties:
                      nullable: true
                    default: &a3
                      schemaVersion: 1
                required:
                  - id
                  - type
                  - position
              maxItems: 500
            edges:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                    minLength: 1
                    maxLength: 128
                  source:
                    type: string
                    minLength: 1
                    maxLength: 128
                  target:
                    type: string
                    minLength: 1
                    maxLength: 128
                  sourceHandle:
                    type: string
                    nullable: true
                    maxLength: 64
                  targetHandle:
                    type: string
                    nullable: true
                    maxLength: 64
                required:
                  - id
                  - source
                  - target
              maxItems: 2000
          required:
            - schemaVersion
            - nodes
            - edges
        name:
          type: string
          minLength: 1
          maxLength: 128
      required:
        - ifRevision
        - graph
    SnapshotWorkflowRequest:
      type: object
      properties:
        ifRevision:
          type: integer
          minimum: 0
      required:
        - ifRevision
    WorkflowDraft:
      type: object
      properties:
        workflowId:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        name:
          type: string
        revisionNumber:
          type: integer
          minimum: 0
        currentRevisionId:
          type: string
          nullable: true
          format: uuid
        graph:
          type: object
          properties:
            schemaVersion:
              type: number
              enum:
                - 1
            nodes:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                    minLength: 1
                    maxLength: 128
                  type:
                    type: string
                    minLength: 1
                    maxLength: 64
                  position:
                    type: object
                    properties:
                      x:
                        type: number
                      y:
                        type: number
                    required:
                      - x
                      - y
                  config:
                    type: object
                    additionalProperties:
                      nullable: true
                    default: *a3
                required:
                  - id
                  - type
                  - position
              maxItems: 500
            edges:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                    minLength: 1
                    maxLength: 128
                  source:
                    type: string
                    minLength: 1
                    maxLength: 128
                  target:
                    type: string
                    minLength: 1
                    maxLength: 128
                  sourceHandle:
                    type: string
                    nullable: true
                    maxLength: 64
                  targetHandle:
                    type: string
                    nullable: true
                    maxLength: 64
                required:
                  - id
                  - source
                  - target
              maxItems: 2000
          required:
            - schemaVersion
            - nodes
            - edges
        updatedAt:
          type: string
          format: date-time
        updatedByUserId:
          type: string
          nullable: true
          format: uuid
      required:
        - workflowId
        - projectId
        - name
        - revisionNumber
        - currentRevisionId
        - graph
        - updatedAt
        - updatedByUserId
  parameters: {}
paths:
  /api/register:
    post:
      summary: Register a new user (creates default workspace)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
                  minLength: 12
                  maxLength: 128
                name:
                  type: string
                  minLength: 1
                  maxLength: 120
              required:
                - email
                - password
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  email:
                    type: string
                    format: email
                  name:
                    type: string
                    nullable: true
                required:
                  - id
                  - email
                  - name
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      requestId:
                        type: string
                      details:
                        nullable: true
                    required:
                      - code
                      - message
                      - requestId
                required:
                  - error
  /api/workspaces/{workspaceId}/uploads/presign:
    post:
      summary: Create presigned upload session + Asset stub
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                projectId:
                  type: string
                  format: uuid
                filename:
                  type: string
                  minLength: 1
                  maxLength: 255
                mimeType:
                  type: string
                  enum: *a4
                bytes:
                  type: integer
                  minimum: 0
                  exclusiveMinimum: true
                  maximum: 20971520
              required:
                - projectId
                - filename
                - mimeType
                - bytes
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  uploadId:
                    type: string
                    format: uuid
                  assetId:
                    type: string
                    format: uuid
                  uploadUrl:
                    type: string
                    format: uri
                  storageKey:
                    type: string
                  expiresAt:
                    type: string
                    format: date-time
                  headers:
                    type: object
                    additionalProperties:
                      type: string
                required:
                  - uploadId
                  - assetId
                  - uploadUrl
                  - storageKey
                  - expiresAt
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      requestId:
                        type: string
                      details:
                        nullable: true
                    required:
                      - code
                      - message
                      - requestId
                required:
                  - error
  /api/workspaces/{workspaceId}/uploads/{uploadId}/complete:
    post:
      summary: Complete upload, verify checksum, enqueue inspect
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                checksumSha256:
                  type: string
                  pattern: ^[a-f0-9]{64}$
                completionKey:
                  type: string
                  minLength: 8
                  maxLength: 128
      responses:
        "200":
          description: Inspecting / ready
          content:
            application/json:
              schema:
                type: object
                properties:
                  uploadId:
                    type: string
                    format: uuid
                  assetId:
                    type: string
                    format: uuid
                  status:
                    type: string
                    enum: *a5
                  assetStatus:
                    type: string
                    enum: *a6
                required:
                  - uploadId
                  - assetId
                  - status
                  - assetStatus
  /api/workspaces/{workspaceId}/projects/{projectId}/truth-pack:
    get:
      summary: Get current Product Truth Pack
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  documentId:
                    type: string
                    format: uuid
                  projectId:
                    type: string
                    format: uuid
                  currentRevisionId:
                    type: string
                    nullable: true
                    format: uuid
                  approvedRevisionId:
                    type: string
                    nullable: true
                    format: uuid
                  revision:
                    type: object
                    nullable: true
                    properties:
                      id:
                        type: string
                        format: uuid
                      revision:
                        type: integer
                      status:
                        type: string
                        enum: *a7
                      facts:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              format: uuid
                            key:
                              type: string
                            value:
                              nullable: true
                            confidence:
                              type: number
                            status:
                              type: string
                              enum: *a1
                            evidenceAssetVersionIds:
                              type: array
                              items:
                                type: string
                                format: uuid
                          required:
                            - id
                            - key
                            - confidence
                            - status
                            - evidenceAssetVersionIds
                      constraints:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              format: uuid
                            kind:
                              type: string
                              enum: *a8
                            path:
                              type: string
                            rule:
                              type: string
                            severity:
                              type: string
                          required:
                            - id
                            - kind
                            - path
                            - rule
                            - severity
                      approvedAt:
                        type: string
                        nullable: true
                        format: date-time
                      approvedByUserId:
                        type: string
                        nullable: true
                        format: uuid
                    required:
                      - id
                      - revision
                      - status
                      - facts
                      - constraints
                      - approvedAt
                      - approvedByUserId
                required:
                  - documentId
                  - projectId
                  - currentRevisionId
                  - approvedRevisionId
                  - revision
    put:
      summary: Save a new Truth Pack draft revision
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                facts:
                  type: array
                  items:
                    type: object
                    properties:
                      key:
                        type: string
                        minLength: 1
                        maxLength: 128
                      value:
                        nullable: true
                      confidence:
                        type: number
                        minimum: 0
                        maximum: 1
                      status:
                        type: string
                        enum: *a1
                      evidenceAssetVersionIds:
                        type: array
                        items:
                          type: string
                          format: uuid
                    required:
                      - key
                  minItems: 1
                locks:
                  type: array
                  items:
                    type: string
                    minLength: 1
                allowedChanges:
                  type: array
                  items:
                    type: string
                    minLength: 1
              required:
                - facts
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  documentId:
                    type: string
                    format: uuid
                  projectId:
                    type: string
                    format: uuid
                  currentRevisionId:
                    type: string
                    nullable: true
                    format: uuid
                  approvedRevisionId:
                    type: string
                    nullable: true
                    format: uuid
                  revision:
                    type: object
                    nullable: true
                    properties:
                      id:
                        type: string
                        format: uuid
                      revision:
                        type: integer
                      status:
                        type: string
                        enum: *a7
                      facts:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              format: uuid
                            key:
                              type: string
                            value:
                              nullable: true
                            confidence:
                              type: number
                            status:
                              type: string
                              enum: *a1
                            evidenceAssetVersionIds:
                              type: array
                              items:
                                type: string
                                format: uuid
                          required:
                            - id
                            - key
                            - confidence
                            - status
                            - evidenceAssetVersionIds
                      constraints:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              format: uuid
                            kind:
                              type: string
                              enum: *a8
