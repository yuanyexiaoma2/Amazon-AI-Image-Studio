name: CI

on:
  push:
    branches: [main, "feat/**", "feature/**", "fix/**"]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: studio
          POSTGRES_PASSWORD: studio
          POSTGRES_DB: studio
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U studio -d studio"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://studio:studio@localhost:5432/studio?schema=public
      AUTH_SECRET: ci-test-secret-please-change-32chars!!
      REDIS_URL: redis://localhost:6379
      S3_ENDPOINT: http://127.0.0.1:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_BUCKET: studio-assets
      S3_FORCE_PATH_STYLE: "true"
      APP_URL: http://127.0.0.1:3000
      NODE_ENV: test
      CI: "true"
      RUN_INTEGRATION: "1"
      INSPECT_INLINE: "1"
      GENERATION_INLINE: "1"
      IMAGE_PROVIDER: fake

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      # Node 22 LTS (engines.node >=22). Prefer 22 over deprecated Node 20 actions warnings.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Start MinIO (object storage)
        run: |
          # Prefer quay.io — Docker Hub pulls for minio/minio are intermittently denied on GHA.
          docker run -d --name studio-minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            quay.io/minio/minio:RELEASE.2024-12-18T13-15-44Z server /data
          for i in $(seq 1 45); do
            if curl -sf http://127.0.0.1:9000/minio/health/live >/dev/null; then
              echo "minio ready"
              exit 0
            fi
            sleep 1
          done
          docker logs studio-minio || true
          exit 1

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: CI health (postgres / redis / minio)
        run: pnpm ci:health

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Migrate (real Postgres)
        run: pnpm db:migrate:deploy

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit + integration tests
        run: pnpm test

      - name: OpenAPI generate
        run: pnpm openapi:generate

      - name: Build packages + apps
        run: pnpm build

      - name: Start web for E2E
        run: |
          pnpm --filter @studio/web start --hostname 127.0.0.1 --port 3000 &
          echo $! > /tmp/web.pid
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:3000/ >/dev/null; then
              echo "web ready"
              exit 0
            fi
            sleep 1
          done
          echo "web failed to start"
          exit 1

      - name: E2E API flow
        run: pnpm test:e2e
